services:
  db:
    image: mariadb:12.3
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: 1234
      MARIADB_DATABASE: auth_db
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./auth-backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  mariadb_data: